[project]
name = "phlasma-studio"
version = "0.1.0"
description = "Agent-first garment, VFX and CAD suite (clean-room, open-source stack)"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "warp-lang>=1.10", "triangle", "trimesh", "scikit-image", "shapely", "pillow", "jsonschema"]

[project.optional-dependencies]
render = ["bpy"]
vfx = ["wgpu"]
cad = ["build123d", "manifold3d", "ezdxf", "numba", "fast-simplification", "rtree"]

[project.scripts]
phlasma = "phlasma.core.cli:main"

[tool.setuptools.packages.find]
include = ["phlasma*"]
